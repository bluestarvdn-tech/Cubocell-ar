<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CuboCell AR – Procarionte</title>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  #ui { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); padding: 14px 16px 32px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
  .badge { background: #e67e22; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: 1px; }
  #ui h1 { font-size: 15px; font-weight: 600; color: #fff; }
  #dica { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 10px 20px; font-size: 13px; color: #fff; z-index: 100; text-align: center; white-space: nowrap; transition: opacity 1s; }
  #painel { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(26,16,10,0.97); border-radius: 20px 20px 0 0; border-top: 1px solid rgba(255,255,255,0.1); padding: 8px 24px 36px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); z-index: 200; }
  #painel.aberto { transform: translateY(0); }
  .handle { width: 32px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 10px auto 16px; }
  #p-nome { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 10px; }
  #p-desc { font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.8); margin-bottom: 20px; }
  #p-fechar { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 12px; border-radius: 12px; font-size: 14px; cursor: pointer; width: 100%; }
  #organelas-bar { position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 70%, transparent); padding: 28px 16px 20px; z-index: 100; }
  .scroll-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .scroll-row::-webkit-scrollbar { display: none; }
  .org-btn { flex-shrink: 0; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 7px 14px; font-size: 12px; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
</style>
</head>
<body>
<div id="ui">
  <span class="badge">Procarionte</span>
  <h1>Célula Procarionte — AR</h1>
</div>
<div id="dica">📷 Aponte para qualquer face do cubo</div>
<div id="organelas-bar"><div class="scroll-row" id="scroll"></div></div>
<div id="painel">
  <div class="handle"></div>
  <div id="p-nome"></div>
  <div id="p-desc"></div>
  <button id="p-fechar" onclick="fecharPainel()">Fechar</button>
</div>

<a-scene
  mindar-image="imageTargetSrc: markers/cubocell-marker.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-entity
      position="0 0 0.1"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
    >
      <!-- Corpo principal da bactéria (bastonete) -->
      <a-cylinder color="#c0750a" radius="0.06" height="0.22" position="0 0 0" rotation="0 0 90" opacity="0.95"></a-cylinder>
      <a-sphere color="#c0750a" radius="0.06" position="-0.11 0 0" opacity="0.95"></a-sphere>
      <a-sphere color="#c0750a" radius="0.06" position="0.11 0 0" opacity="0.95"></a-sphere>

      <!-- Cápsula (camada externa translúcida) -->
      <a-cylinder color="#f0d090" radius="0.075" height="0.24" position="0 0 0" rotation="0 0 90" opacity="0.25"></a-cylinder>
      <a-sphere color="#f0d090" radius="0.075" position="-0.12 0 0" opacity="0.25"></a-sphere>
      <a-sphere color="#f0d090" radius="0.075" position="0.12 0 0" opacity="0.25"></a-sphere>

      <!-- Parede celular -->
      <a-cylinder color="#d4a060" radius="0.065" height="0.23" position="0 0 0" rotation="0 0 90" opacity="0.4" wireframe="true"></a-cylinder>

      <!-- Nucleoide (DNA circular) -->
      <a-torus color="#7090e0" radius="0.028" tube="0.006" position="0 0 0.01" rotation="90 0 0" opacity="0.9"></a-torus>
      <a-torus color="#5070c0" radius="0.018" tube="0.004" position="0 0 0.01" rotation="90 30 0" opacity="0.8"></a-torus>

      <!-- Ribossomos (pontos espalhados) -->
      <a-sphere color="#e08040" radius="0.008" position="0.04 0.02 0.02" opacity="0.9"></a-sphere>
      <a-sphere color="#e08040" radius="0.008" position="-0.04 0.02 0.02" opacity="0.9"></a-sphere>
      <a-sphere color="#e08040" radius="0.008" position="0.06 -0.02 0" opacity="0.9"></a-sphere>
      <a-sphere color="#e08040" radius="0.008" position="-0.06 -0.02 0" opacity="0.9"></a-sphere>
      <a-sphere color="#e08040" radius="0.008" position="0.02 0.04 0" opacity="0.9"></a-sphere>
      <a-sphere color="#e08040" radius="0.008" position="-0.02 -0.04 0" opacity="0.9"></a-sphere>
      <a-sphere color="#e08040" radius="0.007" position="0.05 0.03 -0.02" opacity="0.8"></a-sphere>
      <a-sphere color="#e08040" radius="0.007" position="-0.05 -0.03 -0.02" opacity="0.8"></a-sphere>

      <!-- Flagelos -->
      <a-cylinder color="#d0a0e0" radius="0.003" height="0.14" position="0.16 0.03 0" rotation="0 0 -25" opacity="0.9"></a-cylinder>
      <a-cylinder color="#d0a0e0" radius="0.003" height="0.12" position="0.15 -0.04 0" rotation="0 0 -15" opacity="0.8"></a-cylinder>
      <a-cylinder color="#d0a0e0" radius="0.003" height="0.10" position="-0.16 0.02 0" rotation="0 0 25" opacity="0.9"></a-cylinder>

      <!-- Pili (filamentos curtos ao redor) -->
      <a-cylinder color="#f08080" radius="0.002" height="0.04" position="0 0.07 0" rotation="0 0 0" opacity="0.8"></a-cylinder>
      <a-cylinder color="#f08080" radius="0.002" height="0.04" position="0.05 0.065 0" rotation="0 0 -20" opacity="0.8"></a-cylinder>
      <a-cylinder color="#f08080" radius="0.002" height="0.04" position="-0.05 0.065 0" rotation="0 0 20" opacity="0.8"></a-cylinder>
      <a-cylinder color="#f08080" radius="0.002" height="0.04" position="0 -0.07 0" rotation="0 0 0" opacity="0.8"></a-cylinder>
      <a-cylinder color="#f08080" radius="0.002" height="0.04" position="0.05 -0.065 0" rotation="0 0 20" opacity="0.8"></a-cylinder>
      <a-cylinder color="#f08080" radius="0.002" height="0.04" position="-0.05 -0.065 0" rotation="0 0 -20" opacity="0.8"></a-cylinder>
    </a-entity>
  </a-entity>
</a-scene>

<script>
const organelas = [
  { nome:"Cápsula", cor:"#f0d090", desc:"Camada gelatinosa mais externa. Protege contra fagocitose pelo sistema imune e antibióticos. Contribui para a virulência de bactérias patogênicas." },
  { nome:"Parede Celular", cor:"#d4a060", desc:"Camada rígida de peptidoglicano. Alvo da penicilina — ao destruir sua síntese, a bactéria morre. Bactérias Gram+ têm parede mais espessa." },
  { nome:"Membrana Plasmática", cor:"#e8c87c", desc:"Bicamada de fosfolipídios. Em procariontes, é onde ocorre a respiração celular (sem mitocôndrias). Realiza transporte ativo e síntese de ATP." },
  { nome:"Nucleoide", cor:"#7090e0", desc:"DNA bacteriano circular sem membrana envolvente — por isso procariontes NÃO têm núcleo verdadeiro. Nome significa 'semelhante ao núcleo'." },
  { nome:"Ribossomo", cor:"#e08040", desc:"Menores que ribossomos eucariontes (70S vs 80S). Antibióticos como estreptomicina bloqueiam os bacterianos sem afetar os humanos." },
  { nome:"Flagelo", cor:"#d0a0e0", desc:"Filamento de flagelina que gira como hélice, movendo a bactéria. Pode ser monotríquio (um), anfitríquio (dois extremos) ou peritríquio (vários)." },
  { nome:"Pili", cor:"#f08080", desc:"Filamentos curtos de adesão. Pili comuns fixam a bactéria em superfícies. Pili sexuais (F) conectam bactérias para transferência de DNA (conjugação)." },
  { nome:"Citoplasma", cor:"#f0e0b0", desc:"Solução sem compartimentos. Toda bioquímica bacteriana — respiração, síntese de proteínas e replicação do DNA — ocorre aqui, sem organelas separadas." },
];
const scroll = document.getElementById('scroll');
organelas.forEach((o, i) => {
  const btn = document.createElement('button');
  btn.className = 'org-btn';
  btn.innerHTML = `<span class="dot" style="background:${o.cor}"></span>${o.nome.split(' ')[0]}`;
  btn.onclick = () => abrirPainel(i);
  scroll.appendChild(btn);
});
function abrirPainel(i) {
  document.getElementById('p-nome').textContent = organelas[i].nome;
  document.getElementById('p-desc').textContent = organelas[i].desc;
  document.getElementById('painel').classList.add('aberto');
  document.getElementById('organelas-bar').style.display = 'none';
}
function fecharPainel() {
  document.getElementById('painel').classList.remove('aberto');
  document.getElementById('organelas-bar').style.display = 'block';
}
setTimeout(() => { document.getElementById('dica').style.opacity = '0'; }, 5000);
</script>
</body>
</html>
