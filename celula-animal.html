<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CuboCell AR – Célula Animal</title>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  #ui {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
    padding: 14px 16px 32px;
    display: flex; align-items: center; gap: 10px;
    pointer-events: none;
  }
  .badge { background: #e74c3c; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: 1px; }
  #ui h1 { font-size: 15px; font-weight: 600; color: #fff; }
  #dica {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
    padding: 10px 20px; font-size: 13px; color: #fff;
    z-index: 100; text-align: center; white-space: nowrap;
    transition: opacity 1s;
  }
  #painel {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(13,13,31,0.97);
    border-radius: 20px 20px 0 0;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding: 8px 24px 36px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 200;
  }
  #painel.aberto { transform: translateY(0); }
  .handle { width: 32px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 10px auto 16px; }
  #p-nome { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 10px; }
  #p-desc { font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.8); margin-bottom: 20px; }
  #p-fechar { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 12px; border-radius: 12px; font-size: 14px; cursor: pointer; width: 100%; }
  #organelas-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 70%, transparent);
    padding: 28px 16px 20px;
    z-index: 100;
  }
  .scroll-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .scroll-row::-webkit-scrollbar { display: none; }
  .org-btn {
    flex-shrink: 0; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
    padding: 7px 14px; font-size: 12px; color: #fff; cursor: pointer;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
</style>
</head>
<body>

<div id="ui">
  <span class="badge">Animal</span>
  <h1>Célula Animal — AR</h1>
</div>

<div id="dica">📷 Aponte para qualquer face do cubo</div>

<div id="organelas-bar">
  <div class="scroll-row" id="scroll"></div>
</div>

<div id="painel">
  <div class="handle"></div>
  <div id="p-nome"></div>
  <div id="p-desc"></div>
  <button id="p-fechar" onclick="fecharPainel()">Fechar</button>
</div>

<a-scene
  mindar-image="imageTargetSrc: markers/cubocell-marker.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-assets>
    <a-asset-item id="celula" src="models/celula-animal.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model
      src="#celula"
      position="0 0.05 0.15"
      scale="0.18 0.18 0.18"
      rotation="0 0 0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
    ></a-gltf-model>
  </a-entity>
</a-scene>

<script>
const organelas = [
  { nome:"Membrana Plasmática", cor:"#d8a572", desc:"Camada dupla de fosfolipídios que envolve a célula. Controla o que entra e sai." },
  { nome:"Núcleo", cor:"#4c7fcc", desc:"Centro de controle. Contém o DNA com todas as instruções genéticas da célula." },
  { nome:"Mitocôndria", cor:"#d83f3f", desc:"Usina de energia! Produz ATP por respiração celular aeróbia." },
  { nome:"Complexo de Golgi", cor:"#f2bf33", desc:"Sistema de correios da célula. Modifica e empacota proteínas para envio." },
  { nome:"Retículo E. Rugoso", cor:"#8cbf8c", desc:"Membranas com ribossomos. Sintetiza proteínas para exportação." },
  { nome:"Retículo E. Liso", cor:"#7fcca5", desc:"Membranas sem ribossomos. Sintetiza lipídios e hormônios." },
  { nome:"Lisossomo", cor:"#b272d8", desc:"Vesículas com enzimas digestivas. Destroem resíduos celulares." },
  { nome:"Ribossomo", cor:"#e57f33", desc:"Fábricas de proteínas. Leem o RNA e montam as proteínas." },
  { nome:"Centríolo", cor:"#5999e5", desc:"Par cilíndrico que organiza o fuso mitótico na divisão celular." },
  { nome:"Citoplasma", cor:"#d1a566", desc:"Solução aquosa onde as organelas estão suspensas." },
];

const scroll = document.getElementById('scroll');
organelas.forEach((o, i) => {
  const btn = document.createElement('button');
  btn.className = 'org-btn';
  btn.innerHTML = `<span class="dot" style="background:${o.cor}"></span>${o.nome.split(' ')[0]}`;
  btn.onclick = () => abrirPainel(i);
  scroll.appendChild(btn);
});

function abrirPainel(i) {
  document.getElementById('p-nome').textContent = organelas[i].nome;
  document.getElementById('p-desc').textContent = organelas[i].desc;
  document.getElementById('painel').classList.add('aberto');
  document.getElementById('organelas-bar').style.display = 'none';
}
function fecharPainel() {
  document.getElementById('painel').classList.remove('aberto');
  document.getElementById('organelas-bar').style.display = 'block';
}

setTimeout(() => { document.getElementById('dica').style.opacity = '0'; }, 5000);
</script>
</body>
</html>
